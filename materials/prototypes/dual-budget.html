  document.addEventListener('click', function (event) {
    var target = event.target.closest('[data-action]'); if (!target) return;
    var action = target.dataset.action, id = target.dataset.id;
    if (action === 'close') return closeOverlay();
    if (action === 'navigate') { closeOverlay(); ui.view = target.dataset.view; render(); window.scrollTo(0, 0); return; }
    if (action === 'select-project') { closeOverlay(); ui.project = id; ui.view = 'projects'; render(); window.scrollTo(0, 0); return; }
    if (action === 'choose-project') { ui.project = id; render(); return; }
    if (action === 'scenario') return openForm('付款', id);
    if (action === 'new') return openForm(target.dataset.type);
    if (action === 'form-type') { form.type = target.dataset.type; form.category = form.type === '报销' ? '差旅费' : '外包服务'; form.payee = form.type === '报销' ? '示例项目经办人' : '示例技术服务商'; drawForm(); return; }
    if (action === 'submit') {
      target.disabled = true;
      var r = E.submit(state, form, formKey);
      if (!r.ok) { updateCheck(); toast(r.errors.join(' '), true); return; }
      state = r.state; save(); ui.year = r.doc.year; ui.filter = 'all'; ui.query = ''; ui.view = 'bills'; ui.project = r.doc.projectId; closeOverlay(); render(); showDoc(r.doc.id); toast('申请已提交，' + (r.doc.dual ? '两层预算已同时冻结 ' : '项目预算已冻结 ') + money(r.doc.amount)); return;
    }
    if (action === 'detail') return showDoc(id);
    if (action === 'transition') {
      var result = E.transition(state, id, target.dataset.kind);
      if (!result.ok) return toast(result.error, true);
      state = result.state; save(); render();
      var labels = { approve: '审批已通过，冻结金额保持不变。', pay: '支付已确认，冻结转已用；支出只统计一次。', reject: '已驳回，冻结额度已释放。', withdraw: '已撤回，冻结额度已释放。' };
      toast(labels[target.dataset.kind]); return;
    }
    if (action === 'filter') { ui.filter = id; render(); return; }
    if (action === 'adjust') return openAdjustment(target.dataset.scope, id);
    if (action === 'apply-adjust') {
      var changed = E.adjust(state, drawer.scope, drawer.id, document.getElementById('adjust-amount').value, document.getElementById('adjust-reason').value);
      if (!changed.ok) { document.getElementById('adjust-error').textContent = changed.error; return; }
      state = changed.state; save(); closeOverlay(); render(); toast('预算调整已按审批通过后生效演示，已保留记录。'); return;
    }
    if (action === 'reapply') {
      var d = state.docs.find(function (x) { return x.id === id; });
      openForm(d.type, null, { projectId: d.projectId, date: d.date, amount: (d.amount / 100).toFixed(2), category: d.category, payee: d.payee, purpose: d.purpose }); return;
    }
    if (action === 'confirm-reset') { state = E.seed(); save(); ui.year = 2026; ui.project = 'A'; ui.filter = 'all'; ui.query = ''; closeOverlay(); render(); toast('已恢复初始演示数据。'); }
  });
  document.addEventListener('input', function (event) {
    var el = event.target;
    if (el.dataset.form) { form[el.dataset.form] = el.value; updateCheck(); }
    if (el.id === 'bill-search') { ui.query = el.value; document.getElementById('bill-table').innerHTML = billsTable(); }
  });
  document.addEventListener('change', function (event) {
    var el = event.target;
    if (el.id === 'year-select') { ui.year = Number(el.value); render(); }
    if (el.id === 'relation-project') { ui.project = el.value; render(); }
    if (el.dataset.form) { form[el.dataset.form] = el.value; updateCheck(); }
    if (el.id === 'dual-setting' || el.id === 'receipt-setting') {
      state.settings[el.id === 'dual-setting' ? 'dual' : 'receipt'] = el.checked; save(); render(); toast('规则已更新，仅影响后续新建申请。');
    }
  });
  document.addEventListener('keydown', function (event) {
    var overlay = document.getElementById('overlay'); if (overlay.hidden) return;
    if (event.key === 'Escape') { event.preventDefault(); closeOverlay(); return; }
    if (event.key === 'Tab') {
      var focusable = Array.from(overlay.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href]')).filter(function (x) { return x.offsetParent !== null; });
      var first = focusable[0], last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    }
  });
  document.getElementById('reset-demo').addEventListener('click', resetModal);
  document.getElementById('overlay').addEventListener('click', function (event) { if (event.target.id === 'overlay') closeOverlay(); });
  render();
})();
</script>
</body>
</html>
