:root {
  color-scheme: light;
  background: #eee8df;
}
html, body {
  margin: 0;
  min-width: 0;
  min-height: 100%;
}
body {
  color: #2b2620;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
button, input, textarea, select {
  font: inherit;
}
button, a {
  touch-action: manipulation;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
}
button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 3px solid #956830;
  outline-offset: 3px;
}
[hidden] {
  display: none !important;
}
.review-header {
  max-width: 1060px;
  margin: 0 auto;
  padding: 22px 24px 0;
}
.review-header h1 {
  margin: 0 0 8px;
  font: 600 23px/1.4 "PingFang SC", sans-serif;
}
.prototype-notice {
  margin: 0;
  max-width: 880px;
  color: #74695e;
  font-size: 13px;
  line-height: 1.8;
}
.prototype-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  max-width: 1060px;
  margin: 15px auto 0;
  padding: 0 24px;
}
.role-switch {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 3px;
  padding: 4px;
  border: 1px solid #d8cfc2;
  border-radius: 8px;
  background: #faf6f0;
}
.role-switch button, #reset-prototype {
  min-height: 36px;
  padding: 7px 15px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: #73665b;
  font-size: 13px;
}
.role-switch button[aria-pressed="true"] {
  background: #4a3f35;
  color: #faf6f0;
}
#reset-prototype {
  border: 1px solid #d8cfc2;
  background: #faf6f0;
}
#lt-daily-prototype {
  padding: 0 0 24px;
  color-scheme: light;
}
#lt-daily-prototype button {
  cursor: pointer;
}
#lt-daily-prototype button:disabled {
  cursor: not-allowed;
}
#lt-daily-prototype .lt-stage {
  padding: 19px 12px 0;
  background: transparent;
}
#lt-daily-prototype .lt-phone {
  display: grid;
  grid-template-rows: 43px minmax(0, 1fr) 20px;
  height: min(870px, calc(100dvh - 190px));
  min-height: 620px;
  max-width: 414px;
  border-radius: 30px;
}
#lt-daily-prototype .lt-status {
  height: 43px;
}
#lt-daily-prototype .lt-content {
  min-height: 0;
}
#lt-screen {
  display: flex;
  min-height: 0;
  flex-direction: column;
  overflow: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: #d4c5b6 transparent;
}
#lt-daily-prototype .lt-header {
  flex: 0 0 52px;
  min-height: 52px;
}
#lt-daily-prototype .lt-role-pill {
  padding: 4px 8px;
  border-radius: 4px;
  background: #f0e9de;
  color: #806e5c;
  font-size: 11px;
}
#lt-daily-prototype .lt-tabs {
  position: sticky;
  bottom: 0;
  z-index: 5;
  flex: 0 0 auto;
  min-height: 58px;
  padding: 10px 5px 12px;
  margin-top: auto;
  border-top: 1px solid var(--lt-line);
}
#lt-daily-prototype .lt-tabs button {
  min-height: 32px;
}
#lt-daily-prototype .lt-dock {
  position: sticky;
  bottom: 58px;
  z-index: 5;
  margin-top: auto;
}
#lt-daily-prototype .lt-home-hero {
  margin-bottom: 14px;
}
#lt-daily-prototype .lt-home-hero .lt-primary {
  margin-top: 14px;
}
#lt-daily-prototype .lt-hero-photo {
  width: 100px;
  height: 100px;
  object-fit: cover;
  border-radius: 50%;
}
#lt-daily-prototype .lt-entry-card {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px;
  border: 1px solid var(--lt-line);
  border-radius: 12px;
  background: var(--lt-paper);
  text-align: left;
}
#lt-daily-prototype .lt-entry-card strong {
  display: block;
  font-size: 15px;
}
#lt-daily-prototype .lt-entry-card small {
  display: block;
  margin-top: 7px;
  color: var(--lt-sub);
  font-size: 11px;
  line-height: 1.6;
}
#lt-daily-prototype .lt-entry-card b {
  font-size: 25px;
  font-weight: 400;
}
#lt-daily-prototype .lt-process-note {
  margin-top: 16px;
  color: var(--lt-sub);
  font-size: 12px;
}
#lt-daily-prototype .lt-process-note p {
  margin: 7px 0 0;
  line-height: 1.7;
}
#lt-daily-prototype .lt-stepper {
  gap: 8px;
}
#lt-daily-prototype .lt-stepper button {
  width: 30px;
  height: 30px;
}
#lt-daily-prototype .lt-library {
  flex: 1;
}
#lt-daily-prototype .lt-list {
  min-width: 0;
  padding: 0 10px;
}
#lt-daily-prototype .lt-dish {
  align-items: flex-start;
  gap: 8px;
}
#lt-daily-prototype .lt-dish img {
  width: 61px;
  height: 65px;
}
#lt-daily-prototype .lt-dish-detail .lt-row {
  flex-wrap: wrap;
  gap: 6px;
}
#lt-daily-prototype .lt-tags {
  margin: 4px 0 9px;
  line-height: 1.6;
}
#lt-daily-prototype .lt-cart-sub {

}
#lt-daily-prototype .lt-field {
  display: grid;
  min-width: 0;
  gap: 8px;
  margin-top: 17px;
  color: var(--lt-ink);
  font-size: 13px;
}
#lt-daily-prototype .lt-field input, #lt-daily-prototype .lt-optional {
  min-width: 0;
  width: 100%;
  min-height: 42px;
  padding: 9px 10px;
  border: 1px solid var(--lt-line);
  border-radius: 6px;
  background: var(--lt-paper);
  color: var(--lt-ink);
  font-size: 14px;
}
#lt-daily-prototype textarea.lt-optional {
  margin-top: 10px;
  resize: vertical;
}
#lt-daily-prototype .lt-form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
#lt-daily-prototype .lt-taboo {
  min-width: 0;
  padding-top: 12px;
}
#lt-daily-prototype .lt-checkbox {
  display: inline-flex;
  min-height: 42px;
  align-items: center;
  gap: 6px;
  margin: 4px 10px 4px 0;
  color: var(--lt-ink);
  font-size: 13px;
}
#lt-daily-prototype .lt-checkbox input {

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[char]));

  function notify(message) {

  function go(view) {

  function header(title, backView) {

  }

  function count(cart) {
    return Object.values(cart).reduce((sum, quantity) => sum + quantity, 0);
  }

  function stepper(id, quantity) {
    return '<div class="lt-stepper"><button data-dish="' + id + '" data-delta="-1" aria-label="减少' +
      escapeHtml(dishById(id).name) + '" ' + (!quantity ? 'disabled' : '') + '>−</button><span>' + quantity +
      '</span><button class="lt-plus" data-dish="' + id + '" data-delta="1" aria-label="增加' +
      escapeHtml(dishById(id).name) + '">＋</button></div>';
  }

  function dishRow(dish, cart = state.cart) {
    return '<article class="lt-dish"><img src="' + dish.img + '" alt="' + dish.name + '">' +
      '<div class="lt-dish-detail"><h3 class="lt-dish-name">' + dish.name + '</h3>' +
      '<p class="lt-tags">' + dish.course + ' · ' + dish.tag + '</p><div class="lt-row">' +
      '<span class="lt-price">¥' + dish.price + '<small class="lt-unit"> / 份</small></span>' +
      stepper(dish.id, cart[dish.id] || 0) + '</div></div></article>';
  }

  function orderRows(cart) {
    return selectedDishes(cart).map(dish =>
      '<div class="lt-line-item"><span class="lt-grow">' + dish.name + '</span><span>× ' + cart[dish.id] +
      ' 份</span><span>¥' + dish.price * cart[dish.id] + '</span></div>'
    ).join('');
  }

  function home() {
    const latest = state.orders[0];
    return header('兰亭点餐') + '<div class="lt-content lt-home-content">' +
      '<div class="lt-home-greeting"><div class="lt-eyebrow">LANTING · DINING</div>' +
      '<h1 class="lt-home-heading">用餐安排</h1><p class="lt-muted">日常点餐与商务宴请，统一交给厨房。</p></div>' +
      '<section class="lt-home-hero"><div class="lt-row"><div><h2 class="lt-h1">日常用餐</h2>' +
      '<p class="lt-muted">直接选菜，调整份数后提交</p></div><img class="lt-hero-photo" src="' +
      dishes[1].img + '" alt="示例菜品"></div><button class="lt-primary" data-go="menu">开始点餐 →</button></section>' +
      '<button class="lt-entry-card" data-go="banquet-form"><span><strong>商务宴请 · 智能配餐</strong>' +
      '<small>人数、预算与忌口 → 整桌菜单 → 逐道微调</small></span><b aria-hidden="true">＋</b></button>' +
      '<div class="lt-row lt-home-section"><h2 class="lt-section-title">最近用餐</h2>' +
      '<button class="lt-link" data-go="records">查看全部 ›</button></div>' +
      (latest ? orderCard(latest) : '<div class="lt-box lt-muted">还没有用餐记录，从上方开始安排。</div>') +
      '<section class="lt-box lt-process-note"><strong>本次可体验</strong><p>经营端选菜与配餐，厨房接单、制作、出餐；切换回经营端查看同一笔原型订单。</p></section>' +
      '</div>' + tabs();
  }

  function menu() {
    const list = dishes.filter(dish =>
      (state.category === '全部' || dish.course === state.category) &&
      (dish.name + dish.tag).includes(state.keyword)
    );
    const categories = ['全部', '冷菜', '热菜', '位菜', '汤', '主食', '甜品'];
    return header('日常点餐', 'home') + '<div class="lt-content">' +
      '<div class="lt-welcome"><div class="lt-row"><div><h1 class="lt-h1">选好菜，直接交给厨房</h1>' +
      '<p class="lt-muted">8 道演示菜品 · 按份点选</p></div></div>' +
      '<div class="lt-quick">' + ['午餐', '晚餐'].map(value =>
        '<button class="lt-chip ' + (state.meal === value ? 'lt-active' : '') + '" data-meal="' + value + '">' +
        value + '</button>').join('') + '</div></div>' +
      '<label class="lt-search"><span aria-hidden="true">⌕</span><input id="dish-search" type="search" aria-label="搜索菜名或食材" placeholder="搜索菜名或食材" value="' +
      escapeHtml(state.keyword) + '"></label><div class="lt-library"><nav class="lt-categories" aria-label="菜品分类">' +
      categories.map(category => '<button data-category="' + category + '" class="' +
      (state.category === category ? 'lt-active' : '') + '">' + category + '</button>').join('') +
      '</nav><div class="lt-list">' + (list.map(dish => dishRow(dish)).join('') ||
      '<p class="lt-empty">没有匹配菜品，换一个关键词试试。</p>') + '</div></div></div>' +
      '<div class="lt-dock"><div class="lt-cartbar"><span><strong class="lt-cart-total">¥' + total(state.cart) +
      '</strong><small class="lt-cart-sub">已选 ' + count(state.cart) + ' 份</small></span>' +
      '<button class="lt-submit" data-action="review" ' + (!count(state.cart) ? 'disabled' : '') +
      '>确认菜品</button></div></div>' + tabs();
  }

  function confirm() {
    return header('确认点单', 'menu') + '<div class="lt-content lt-pad"><section class="lt-box">' +
      '<h1 class="lt-section-title">确认已选菜品</h1><p class="lt-muted">' + state.meal + ' · 尽快制作</p>' +
      orderRows(state.cart) + '<div class="lt-row lt-total-row"><strong>合计 ' + count(state.cart) +
      ' 份</strong><strong>¥' + total(state.cart) + '</strong></div></section>' +
      '<section class="lt-box"><label class="lt-section-title" for="daily-note">口味备注</label>' +
      '<textarea id="daily-note" class="lt-optional" rows="3" maxlength="120" placeholder="例如：少油、少盐">' +
      escapeHtml(state.note) + '</textarea></section>' +
      '<button class="lt-primary" data-action="submit-daily" ' + (!count(state.cart) ? 'disabled' : '') +
      '>提交厨房</button><button class="lt-secondary" data-go="menu">继续选菜</button></div>';
  }

  function banquetForm() {
    const form = state.banquet;
    return header('新建宴请', 'home') + '<form id="banquet-form" class="lt-content lt-pad">' +
      '<section class="lt-box"><h1 class="lt-section-title">宴请条件</h1>' +
      '<label class="lt-field">宴请名称<input name="name" required maxlength="30" value="' + escapeHtml(form.name) +
      '"></label><div class="lt-form-grid"><label class="lt-field">用餐人数<input name="guests" type="number" min="2" max="12" step="1" required value="' +
      form.guests + '"></label><label class="lt-field">人均预算（元）<input name="perHead" type="number" min="10" max="300" step="1" required value="' +
      form.perHead + '"></label></div><p class="lt-small">本原型按一桌 4–6 道菜演示配餐，预算由人数 × 人均预算计算。</p></section>' +
      '<fieldset class="lt-box lt-taboo"><legend class="lt-section-title">本次忌口</legend>' +
      ['海鲜', '牛肉', '猪肉', '鸡蛋'].map(value => '<label class="lt-checkbox"><input type="checkbox" name="taboo" value="' +
      value + '" ' + (form.taboos.includes(value) ? 'checked' : '') + '>不吃' + value + '</label>').join('') +
      '<p class="lt-small">根据这 8 道演示菜的食材标签筛选，换菜时继续检查相同约束。</p></fieldset>' +
      '<button type="submit" class="lt-primary">一键生成整桌菜单</button></form>';
  }

  function allowedDishes() {
    return dishes.filter(dish => !dish.taboos.some(tag => state.banquet.taboos.includes(tag)));
  }

  function generateBanquet() {
    const slots = state.banquet.guests > 4 ?
      ['冷菜', '热菜', '热菜', '汤', '主食', '甜品'] : ['冷菜', '热菜', '汤', '主食'];
    const eligible = allowedDishes();
    const selected = [];
    const missing = [];
    for (const course of slots) {
      const choices = eligible.filter(dish => dish.course === course && !selected.includes(dish.id));
      choices.sort((a, b) => a.price - b.price);
      if (choices.length) selected.push(choices[0].id);
      else missing.push(course);
    }
    state.banquet.selected = selected;
    state.banquet.feedback = missing.length ?
      '当前忌口下缺少' + [...new Set(missing)].join('、') + '候选，可调整条件后重新生成。' : '';
    go('banquet-menu');
  }

  function banquetCart() {
    return Object.fromEntries(state.banquet.selected.map(id => [id, 1]));
  }

  function banquetMenu() {
    const form = state.banquet;
    const cost = total(banquetCart());
    const budget = form.guests * form.perHead;
    const overBudget = cost > budget;
    const complete = !form.feedback && form.selected.length > 0;
    return header('生成餐单', 'banquet-form') + '<div class="lt-content lt-pad">' +
      '<section class="lt-box"><div class="lt-row"><strong>' + escapeHtml(form.name) + '</strong><span class="lt-pill">' +
      form.guests + ' 人</span></div><p class="lt-muted">整桌预算 ¥' + budget +
      ' · 忌口 ' + (form.taboos.length ? form.taboos.join('、') : '无') +
      '</p><div class="lt-rule-state">✓ 已按本次忌口筛选　·　逐道替换保留约束</div></section>' +
      (form.feedback ? '<div class="lt-alert" role="status">' + form.feedback + '</div>' : '') +
      '<section class="lt-box">' + form.selected.map((id, index) => {
        const dish = dishById(id);
        return '<div class="lt-line-item"><img src="' + dish.img + '" alt="' + dish.name +
          '"><span class="lt-grow"><strong>' + dish.name + '</strong><small class="lt-small">' +
          dish.course + ' · ' + dish.tag + '</small></span><span>¥' + dish.price +
          '</span><button class="lt-link" data-swap="' + index + '">换菜</button></div>';
      }).join('') + '<div class="lt-row lt-total-row"><strong>合计 ' + form.selected.length +
      ' 道</strong><strong>¥' + cost + '</strong></div></section>' +
      (overBudget ? '<p class="lt-alert">已超出整桌预算，请换菜或返回调整预算。</p>' : '') +
      '<button class="lt-primary" data-action="submit-banquet" ' + ((!complete || overBudget) ? 'disabled' : '') +
      '>确认餐单并提交厨房</button><button class="lt-secondary" data-action="regenerate">重新生成</button>' +
      '<button class="lt-secondary" data-go="banquet-form">调整人数、预算或忌口</button></div>';
  }

  function openSwap(index) {
    state.swapIndex = index;
    const current = dishById(state.banquet.selected[index]);
    const restCost = total(banquetCart()) - current.price;
    const max = state.banquet.guests * state.banquet.perHead;
    const choices = dishes.filter(dish =>
      dish.id !== current.id && !state.banquet.selected.includes(dish.id)
    );
    document.getElementById('swap-title').textContent = '替换「' + current.name + '」';
    document.getElementById('swap-list').innerHTML = choices.map(dish => {
      const taboo = dish.taboos.find(tag => state.banquet.taboos.includes(tag));
      const reason = taboo ? '与忌口冲突：' + taboo :
        dish.course !== current.course ? '菜位不同：' + dish.course :
          restCost + dish.price > max ? '换入后超出整桌预算' : '';
      return '<button class="lt-swap-option" data-replace="' + dish.id + '" ' + (reason ? 'disabled' : '') +
        '><img src="' + dish.img + '" alt=""><span><strong>' + dish.name + '</strong><small>' +
        (reason || '同菜位 · 符合本次忌口与预算') + '</small></span><b>¥' + dish.price + '</b></button>';
    }).join('');
    swapDialog.showModal();
  }

  function submit(type) {
    const cart = type === 'banquet' ? banquetCart() : { ...state.cart };
    if (!count(cart)) return notify('请先选择菜品。');
    if (type === 'banquet') {
      const banned = selectedDishes(cart).some(dish => dish.taboos.some(tag => state.banquet.taboos.includes(tag)));
      if (banned || state.banquet.feedback || total(cart) > state.banquet.guests * state.banquet.perHead) {
        return notify('请先处理餐单中的忌口、缺口或预算问题。');
      }
    }
    const order = {
      id: 'DEMO-' + String(state.orders.length + 1).padStart(3, '0'),
      type: type,
      title: type === 'banquet' ? state.banquet.name : '日常用餐',
      meal: type === 'banquet' ? '宴请用餐' : state.meal,
      cart: { ...cart },
      note: type === 'banquet' ? '忌口：' + (state.banquet.taboos.join('、') || '无') : state.note,
      status: 'pending'
    };
    state.orders.unshift(order);
    state.currentOrder = order.id;
    if (type === 'daily') state.cart = {};
    go('order');
    notify('已提交厨房，可切换厨房端继续接单。');
  }

  function orderCard(order) {
    return '<button class="lt-order-card" data-order="' + order.id + '"><div class="lt-row"><strong>' +
      escapeHtml(order.title) + '</strong><span class="lt-pill">' + statusNames[order.status] + '</span></div>' +
      '<p class="lt-small">' + order.id + ' · ' + order.meal + ' · ' + count(order.cart) + ' 份</p>' +
      '<div class="lt-row"><span>¥' + total(order.cart) + '</span><span class="lt-link">查看详情 ›</span></div></button>';
  }

  function records() {
    return header('用餐记录', 'home') + '<div class="lt-content lt-pad"><h1 class="lt-section-title">日常与宴请记录</h1>' +
      (state.orders.length ? state.orders.map(orderCard).join('') :
        '<div class="lt-empty">还没有订单，先去选择菜品。</div>') + '</div>' + tabs();
  }

  function order() {
    const current = state.orders.find(item => item.id === state.currentOrder);
    if (!current) return records();
    const stage = statusOrder.indexOf(current.status);
    const nextText = { pending: '接单', accepted: '开始制作', preparing: '完成出餐' }[current.status];
    return header(state.role === 'kitchen' ? '厨房订单详情' : '用餐订单', state.role === 'kitchen' ? 'kitchen' : 'records') +
      '<div class="lt-content lt-pad"><section class="lt-box"><h1 class="lt-h1">' + statusNames[current.status] + '</h1>' +
      '<p class="lt-muted">' + current.id + ' · ' + escapeHtml(current.title) + '</p><div class="lt-steps">' +
      statusOrder.map((key, index) => '<span class="' + (index <= stage ? 'lt-active' : '') + '">' +
      statusNames[key] + '</span>').join('') + '</div></section><section class="lt-box">' +
      '<h2 class="lt-section-title">' + (state.role === 'kitchen' ? '出品明细' : '已选菜品') + '</h2>' +
      orderRows(current.cart) + '<div class="lt-row lt-total-row"><strong>合计</strong><strong>¥' +
      total(current.cart) + '</strong></div></section><section class="lt-box"><h2 class="lt-section-title">用餐要求</h2><p>' +
      escapeHtml(current.note || '无特殊要求') + '</p></section>' +
      (state.role === 'kitchen' && nextText ? '<button class="lt-primary" data-action="next-status">' + nextText +
        '</button>' : state.role === 'kitchen' ? '<p class="lt-rule-state">✓ 本单已完成出餐</p>' :
        current.status === 'done' ? '<button class="lt-primary" data-go="records">查看用餐记录</button>' :
        '<button class="lt-primary" data-role="kitchen">切换厨房端继续办理</button>') +
      '</div>' + tabs();
  }

  function kitchen() {
    const filtered = state.orders.filter(order => state.filter === '全部' || statusNames[order.status] === state.filter);
    return header('厨房工作台') + '<div class="lt-content lt-pad"><h1 class="lt-h1">接单与出品</h1>' +
      '<p class="lt-muted">经营端提交的日常单、宴请单在此集中办理。</p><div class="lt-filter-row">' +
      ['全部', ...Object.values(statusNames)].map(value => '<button data-filter="' + value +
      '" class="lt-chip ' + (state.filter === value ? 'lt-active' : '') + '">' + value + '</button>').join('') +
      '</div>' + (filtered.length ? filtered.map(orderCard).join('') :
      '<div class="lt-empty">当前没有' + (state.filter === '全部' ? '' : state.filter) +
      '订单。<br>切换经营端，先提交一笔用餐安排。</div>') + '</div>';
  }

  function admin() {
    return header('菜品资料') + '<div class="lt-content lt-pad"><section class="lt-box"><h1 class="lt-section-title">演示菜品目录 · 8 道</h1>' +
      '<p class="lt-muted">按菜位、示例单价与食材标签组织配餐。这里只展示原型中的脱敏样本。</p></section>' +
      dishes.map(dish => '<article class="lt-admin-dish"><img src="' + dish.img + '" alt="' + dish.name +
      '"><div><strong>' + dish.name + '</strong><p>' + dish.course + ' · ¥' + dish.price +
      '/份</p><small>' + dish.tag + '</small></div></article>').join('') + '</div>';
  }

  function render() {
    const pages = { home, menu, confirm, 'banquet-form': banquetForm, 'banquet-menu': banquetMenu, records, order, kitchen, admin };
    screen.innerHTML = pages[state.view]();
    root.dataset.view = state.view;
    document.querySelectorAll('[data-role]').forEach(button => {
      button.setAttribute('aria-pressed', String(button.dataset.role === state.role));
    });
    screen.scrollTop = 0;
  }

  document.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button || button.disabled) return;
    if (button.dataset.role) {
      state.role = button.dataset.role;
      state.filter = '全部';
      go(state.role === 'kitchen' ? 'kitchen' : state.role === 'admin' ? 'admin' : 'home');
      return;
    }
    if (button.dataset.go) return go(button.dataset.go);
    if (button.dataset.dish) {
      const id = button.dataset.dish;
      state.cart[id] = Math.max(0, Math.min(20, (state.cart[id] || 0) + Number(button.dataset.delta)));
      const position = screen.scrollTop;
      render();
      screen.scrollTop = position;
      return;
    }
    if (button.dataset.category) {
      state.category = button.dataset.category;
      return render();
    }
    if (button.dataset.meal) {
      state.meal = button.dataset.meal;
      return render();
    }
    if (button.dataset.order) {
      state.currentOrder = button.dataset.order;
      return go('order');
    }
    if (button.dataset.filter) {
      state.filter = button.dataset.filter;
      return render();
    }
    if (button.dataset.swap !== undefined) return openSwap(Number(button.dataset.swap));
    if (button.dataset.replace) {
      const dish = dishById(button.dataset.replace);
      const current = dishById(state.banquet.selected[state.swapIndex]);
      if (!dish || dish.course !== current.course || !allowedDishes().includes(dish)) return;
      const cart = banquetCart();
      delete cart[current.id];
      cart[dish.id] = 1;
      if (total(cart) > state.banquet.guests * state.banquet.perHead) return;
      state.banquet.selected[state.swapIndex] = dish.id;
      swapDialog.close();
      render();
      notify('已替换，保留本次忌口与预算约束。');
      return;
    }
    if (button.id === 'reset-prototype') {
      state = initialState();
      if (swapDialog.open) swapDialog.close();
      render();
      return notify('原型已重置。');
    }
    const actions = {
      review: () => count(state.cart) ? go('confirm') : notify('请先选菜。'),
      'submit-daily': () => submit('daily'),
      'submit-banquet': () => submit('banquet'),
      regenerate: generateBanquet,
      'next-status': () => {
        const current = state.orders.find(item => item.id === state.currentOrder);
        const index = statusOrder.indexOf(current.status);
        if (index < statusOrder.length - 1) current.status = statusOrder[index + 1];
        render();
        notify('已更新为' + statusNames[current.status] + '。');
      }
    };
    actions[button.dataset.action]?.();
  });

  screen.addEventListener('submit', event => {
    if (event.target.id !== 'banquet-form') return;
    event.preventDefault();
    const form = new FormData(event.target);
    state.banquet = {
      name: String(form.get('name') || '').trim() || '示例商务宴请',
      guests: Math.max(2, Math.min(12, Number(form.get('guests')))),
      perHead: Math.max(10, Math.min(300, Number(form.get('perHead')))),
      taboos: form.getAll('taboo'),
      selected: [],
      feedback: ''
    };
    generateBanquet();
  });

  screen.addEventListener('input', event => {
    if (event.target.id === 'daily-note') state.note = event.target.value;
    if (event.target.id === 'dish-search') {
      const position = event.target.selectionStart;
      state.keyword = event.target.value;
      render();
      const input = document.getElementById('dish-search');
      input.focus();
      input.setSelectionRange(position, position);
    }
  });

  swapDialog.addEventListener('click', event => {
    if (event.target === swapDialog) swapDialog.close();
  });
  render();
})();

</script></body></html>
