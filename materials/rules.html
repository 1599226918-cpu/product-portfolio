<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>需求与规则｜我的作品集</title><link rel="stylesheet" href="/product-portfolio/materials/material.css"><script defer src="/product-portfolio/materials/material.js"></script></head><body><nav><a href="/product-portfolio/">回到首页</a><a href="/product-portfolio/shows/">项目案例</a><a href="/product-portfolio/books/">产品文档</a></nav><h1>需求与规则</h1><h2>采购审批：先把角色、状态与例外写清楚</h2><p class="note">作品集展示稿 · 示例内容。用于说明材料的呈现方式，尚未替换为原始项目交付件；不连接真实业务数据。</p><h2>一张申请表，三个关键问题</h2><p>谁可以发起？谁负责处理？被退回之后如何继续？下面用示例状态流转把规则变成可讨论的交互。</p><div class="panel"><div class="flow"><span>草稿</span><span>待审批</span><span>已通过</span><span>已退回</span></div><p class="status" data-status></p><div class="tabs"><button data-submit>提交申请</button><button data-approve>审批通过</button><button data-reject>退回修改</button><button data-reset>重新体验</button></div></div><div class="panel"><table><thead><tr><th>状态</th><th>允许动作</th><th>需要说明的边界</th></tr></thead><tbody><tr><td>草稿</td><td>编辑、提交</td><td>必填项和角色权限</td></tr><tr><td>待审批</td><td>通过、退回</td><td>谁负责下一步，如何防止重复处理</td></tr><tr><td>已退回</td><td>修改后重新提交</td><td>退回原因与原审批意见如何保留</td></tr><tr><td>已通过</td><td>查看后续处理</td><td>审批完成不等于收件或结算完成</td></tr></tbody></table></div><p><a class="download" href="/product-portfolio/materials/rules.txt" download>下载这份展示稿</a></p></body></html>
