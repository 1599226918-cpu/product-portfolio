='card';material()">卡片</button><button class="${S.view==='list'?'active':''}" onclick="S.view='list';material()">列表</button></div></div><div id="projectresults"></div><p class="footerhint">保留原有资料项目、工作类型、上传下载与回收站基础；任务、审批、知识问答为扩展方案。项目及分类内容均为虚构示例。</p>`}`;if(canRead())refreshProjects()}
function refreshProjects(){const arr=filtered();$('projectresults').innerHTML=`<div class="row" style="margin:0 0 13px"><label class="checkboxlabel"><input type="checkbox" aria-label="全选筛选结果" ${arr.length&&arr.every(p=>S.selected.has(p.id))?'checked':''} onchange="selectProjects(this.checked)">全选当前结果</label><small>共 ${arr.length} 个项目</small><small class="right">最近更新排序</small></div>${S.selected.size?`<div class="batch"><span>已选 <b>${S.selected.size}</b> 个项目</span><button class="primary" onclick="exportManifest()">打包下载附件</button><button onclick="S.selected.clear();refreshProjects()">清空选择</button></div>`:''}${!arr.length?'<div class="empty">未找到符合条件的资料项目</div>':S.view==='card'?`<div class="grid">${arr.sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<article class="proj"><div class="row"><input aria-label="选择${esc(p.code)}" type="checkbox" ${S.selected.has(p.id)?'checked':''} onchange="toggleProject(${p.id},this.checked)"><span class="code">${p.code}</span><span class="right">${tag(p.status)}</span></div><button class="plain" style="text-align:left;color:var(--ink)" onclick="openProject(${p.id})"><h2>${esc(p.name)}</h2></button><small>${p.type} · ${p.owner}</small><div class="meter"><i style="width:${p.total?p.filled/p.total*100:0}%"></i></div><div class="projfoot"><span>分类覆盖 ${p.filled}/${p.total} · ${p.files} 个文件</span><span>${p.date.slice(5)}</span></div><div style="text-align:right;margin-top:12px"><button class="plain" style="font-size:12px" onclick="openProject(${p.id})">进入资料项目 →</button></div></article>`).join('')}</div>`:`<div class="box tablewrap"><table><thead><tr><th>选择</th><th>项目编码</th><th>项目名称</th><th>工作类型</th><th>分类覆盖</th><th>文件数</th><th>状态</th><th>操作</th></tr></thead><tbody>${arr.map(p=>`<tr><td><input type="checkbox" aria-label="选择${p.code}" ${S.selected.has(p.id)?'checked':''} onchange="toggleProject(${p.id},this.checked)"></td><td>${p.code}</td><td>${esc(p.name)}</td><td>${p.type}</td><td>${p.filled}/${p.total}</td><td>${p.files}</td><td>${tag(p.statu function saveUpload(){if(!canWrite())return;const fs=Array.from($('uploadinput').files);if(!fs.length){$('uploaderror').textContent='请先选择文件';return}const allowed=['doc','docx','xls','xlsx','ppt','pptx','pdf','jpg','jpeg','png','gif','webp','mp4','mov','txt'];if(fs.some(f=>f.size>50*1024*1024||!allowed.includes(f.name.split('.').pop().toLowerCase()))){$('uploaderror').textContent='有文件超过 50MB 或格式不支持，请重新选择';return}const cat=$('uploadcat').value;const p=projects.find(p=>p.id===S.project);const had=files.some(f=>f.p===p.id&&f.cat===cat);fs.forEach(f=>files.push({id:Date.now()+files.length,p:p.id,cat,name:f.name,size:(f.size/1024).toFixed(0)+' KB',date:'本次演示'}));p.files+=fs.length;if(!had)p.filled=Math.min(p.total,p.filled+1);S.category=cat;closeModal();drawFiles();if(S.page==='material')material();notice('文件元数据已添加；未上传任何文件内容')}

function locked(t){return t.dependency&&S.tasks.find(x=>x.id===t.dependency)?.state!=='已完成'}
function drawTasks(){const ts=projectTasks();$('drawerbody').innerHTML=`<div class="row" style="margin-bottom:15px"><h2>任务协作 <small>新增扩展 · 共 ${ts.length} 项</small></h2><div class="right seg"><button class="${S.mode==='board'?'active':''}" onclick="S.mode='board';drawTasks()">看板</button><button class="${S.mode==='list'?'active':''}" onclick="S.mode='list';drawTasks()">列表</button>${canWrite()?'<button class="primary" onclick="newTask()">＋ 新建任务</button>':''}</div></div><div class="note">子任务包含在任务总数内；锁定作为阻塞原因显示在“待开始”状态中。演示可认领、完成任务，并观察依赖解锁。</div>${S.mode==='board'?`<div class="kanban">${['待开始','进行中','审核中','已完成'].map(st=>`<div class="column"><h3>${st}<span class="muted">${ts.filter(t=>t.state===st).length}</span></h3>${ts.filter(t=>t.state===st).map(taskCard).join('')}</div>`).join('')}</div>`:`<div class="box tablewrap"><table><thead><tr><th>任务名称</th><th>负责人</th><th>状态</th><th>截止日期</th><th>关联分类</th><th>操作</th></tr></thead><tbody>${ts.map(t=>`<tr><td>${t.parent?'↳ ':''}${esc(t.name)}</td><td>${t.owner}</td><td>${tag(t.state)} ${locked(t)?'· 前置未完成':''}</td><td>${t.date}</td><td>${t.cat}</td><td>${taskButton(t)}</td></tr>`).join('')}</tbody></table></div>`}`}
function taskButton(t){if(!canWrite())return '<small>只读</small>';if(locked(t))return '<button disabled>等待前置任务</button>';if(t.state==='待开始')return `<button onclick="actTask(${t.id},'进行中')">认领任务</button>`;if(t.state==='进行中')return `<button onclick="actTask(${t.id},'已完成')">完成任务</button>`;if(t.state==='审核中')return '<small>等待审批角色处理</small>';return '<span class="tag green">已完成</span>'}
function taskCard(t){return `<div class="task ${locked(t)?'locked':''}"><h3>${t.parent?'↳ ':''}${esc(t.name)}</h3><small>${t.cat} · 截止 ${t.date.slice(5)}</small><small>${t.owner}</small>${locked(t)?'<span class="tag">前置：复核图纸会审纪要</span>':''}<div style="margin-top:10px">${taskButton(t)}</div></div>`}
function actTask(id,state){const t=S.tasks.find(x=>x.id===id);if(!canWrite()||locked(t))return;t.state=state;if(state==='进行中')t.owner='演示用户';drawTasks();notice(state==='已完成'?'演示任务已完成，依赖状态已重新计算':'已认领演示任务')}
function newTask(){modal('新建任务',`<label>任务名称 *</label><input id="taskname" maxlength="80"><label>关联分类</label><select id="taskcat">${projectCats().map(c=>`<option>${c}</option>`).join('')}</select><label>截止日期 *</label><input type="date" id="taskdate" value="2026-09-22"><p id="taskerror" style="color:#c75b4a;margin-top:10px"></p>`,`<button onclick="closeModal()">取消</button><button class="primary" onclick="saveTask()">创建演示任务</button>`)}
function saveTask(){if(!canWrite())return;const n=$('taskname').value.trim(),d=$('taskdate').value;if(!n||!d){$('taskerror').textContent='请填写任务名称和截止日期';return}S.tasks.push({id:Date.now(),p:S.project,name:n,state:'待开始',owner:'待认领',date:d,cat:$('taskcat').value});closeModal();drawTasks()}
function drawGantt(){const ts=projectTasks();$('drawerbody').innerHTML=`<div class="row" style="margin-bottom:15px"><h2>时间计划</h2><span class="right tag blue">新增 · 排期示意</span></div><div class="note">2026 年 9 月 15—21 日 · 与任务列表共享状态；本视图为截止日期位置示意，尚无开始日期与自动排程功能。</div><div class="box tablewrap"><div class="ganttrow"><b>任务名称</b>${[15,16,17,18,19,20,21].map(d=>`<span>09/${d}</span>`).join('')}</div>${ts.map(t=>{const d=Math.min(6,Math.max(0,Number(t.date.slice(-2))-15));return `<div class="ganttrow"><span>${esc(t.name)}</span><span class="ganttbar ${locked(t)?'orange':''}" style="grid-column:${d+2};overflow:hidden;white-space:nowrap" title="${t.date}">${t.state==='已完成'?'✓':locked(t)?'锁定':'●'}</span></div>`}).join('')}</div>`}
function drawApproval(){$('drawerbody').innerHTML=`<div class="row" style="margin-bottom:15px"><h2>资料归档审批</h2><span class="right tag blue">新增业务接入</span></div><div class="note">现有合同审批与通用工作流可作为接入基础。资料归档需配置独立流程、业务关联及通过后的归档动作。下方节点仅为评审示意。</div><div class="box flow"><div class="node"><span class="tag green">已完成</span><h3 style="margin-top:8px">发起归档申请</h3><small>发起人 · 项目成员甲</small></div><div class="node active"><span class="tag orange">当前节点</span><h3 style="margin-top:8px">项目负责人审核</h3><small>审核资料目录、文件及必交项</small></div><div class="node"><span class="tag">等待中</span><h3 style="margin-top:8px">部门负责人确认</h3><small>是否需要法务 / 财务会签由流程配置决定</small></div><div class="node"><span class="tag">等待中</span><h3 style="margin-top:8px">归档完成</h3><small>完成审批后写入归档状态与操作记录</small></div></div><p class="muted">流程配置进入现有管理员工作流入口；业务项目页集中展示审批状态和记录。</p>`}
function drawDeps(){const ts=projectTasks().filter(t=>t.dependency);$('drawerbody').innerHTML=`<h2 style="margin-bottom:16px">依赖关系</h2><div class="note">前置任务完成才允许后置任务认领。资料齐套、审批通过、文件定稿为独立条件，不能用“存在文件”替代。</div><div class="box">${ts.length?ts.map(t=>`<div class="listrow"><div><h3>${esc(S.tasks.find(x=>x.id===t.dependency).name)} → ${esc(t.name)}</h3><p>触发条件：前置任务已完成</p></div><span class="right tag ${locked(t)?'orange':'green'}">${locked(t)?'未满足 · 禁止认领':'已满足 · 可启动'}</span></div>`).join(''):'<p class="muted">当前演示项目暂无依赖关系</p>'}</div><div class="box"><h2>实施时需要补齐</h2><ul class="steps"><li>禁止任务依赖自身，保存时检测循环依赖。</li><li>并发认领由服务端保证同一任务仅一位负责人。</li><li>完成、撤回、驳回均重新计算依赖，并保留审计记录。</li><li>任务完成只改变任务状态，不自动视为资料已验收或归档。</li></ul></div>`}
function contractFilters(){modal('保留现有高级筛选',`<div class="note" style="margin-top:18px">正式适配时原有筛选条件全部保留，可收纳于可展开区域。</div><ul class="steps"><li>合同类别、合同类型</li><li>合作信息、合同性质</li><li>项目经理、审批状态</li><li>合同金额最小值 / 最大值</li></ul><p class="muted">原型已演示项目编码 / 名称及审批状态的实际过滤。</p>`)}
function exportContracts(){let arr=contracts.filter(c=>S.cselected.has(c.id));if(!arr.length)arr=contractRows();downloadText('演示合同台账.csv','\ufeff项目编码,项目名称,初定金额,增减项,最终金额,审批状态\n'+arr.map(c=>[c.code,c.name,c.initial,c.adjust,c.final,c.state].join(',')).join('\n'));notice('已下载演示 CSV；正式版保留现有 Excel 导出')}
function contractDetail(id){const c=contracts.find(x=>x.id===id);modal('合同详情',`<div style="margin-top:15px">${tag(c.state)} <span class="muted">${c.code}</span><h2 style="margin-top:12px">${c.name}</h2></div><div class="listrow">部门：${c.dept} · 项目经理：${c.owner}</div><div class="listrow">初定 ¥${money(c.initial)} + 增减 ¥${money(c.adjust)}</div><div class="listrow"><b>最终合同金额 ¥${money(c.final)}</b></div><div class="note" style="margin-top:16px">实际回款：尚未接入。收付款计划与流水核销属于后续财务扩展。</div><h3>分期计划示例（待业务确认）</h3><table><thead><tr><th>期次</th><th>比例</th><th>计划金额</th></tr></thead><tbody>${[30,40,30].map((v,i)=>`<tr><td>第 ${i+1} 期</td><td>${v}%</td><td>¥${money(Math.round(c.final*v)/100)}</td></tr>`).join('')}</tbody></table>`,`<button onclick="closeModal();openProject(${id})">查看关联资料</button><button class="primary" onclick="closeModal();nav('todo')">查看审批入口</button>`)}
function ai(){location.href='../oa-assistant/'}
function ask(q){q=q.trim();if(!q)return;let answer,cite;if(q.includes('上传')){answer='进入有写入权限的部门资料项目，在“分类与文件”选择分类后上传。此演示按单文件不超过 50 MB 的规则处理，支持 Office、PDF、图片、视频和 TXT。DWG 不在现有白名单。';cite='upload'}else if(q.includes('覆盖')||q.includes('齐套')){answer='不等于。当前进度是“已有文件的顶级分类数 / 顶级分类总数”，子项有文件也计入该顶级分类。齐套率还需要明确必交资料、适用条件及审核结果，不能直接沿用覆盖率。';cite='coverage'}else{answer='当前演示知识集中没有足够依据回答这个问题。实际回款应从已确认的财务流水计算，不能由合同总额或分期计划推算。正式接入后仍需按用户权限检索，并在资料不足时明确说明。';cite=null}$('chatbody').insertAdjacentHTML('beforeend',`<div class="bubble user">${esc(q)}</div><div class="bubble">${answer}${cite?`<div style="margin-top:12px"><button class="plain" onclick="citation('${cite}')">[1] 查看依据与原文摘录 →</button></div>`:'<div class="tag" style="margin-top:12px">未找到可引用的业务记录</div>'}</div>`);$('chatinput').value='';$('chatbody').scrollTop=$('chatbody').scrollHeight}
function citation(kind){modal('回答依据 · 演示规则',kind==='upload'?`<div class="note" style="margin-top:18px">来源：资料上传演示规则。</div><h3>校验规则摘录</h3><p style="margin:14px 0">文件大小超过 50MB 时拒绝；服务端按允许的扩展名列表校验。</p><p>项目与文件操作使用部门可读 / 可写校验。</p>`:`<div class="note" style="margin-top:18px">来源：ProjectDetail.vue · filledCount / progressPct</div><h3>现有计算口径</h3><p style="margin:14px 0">顶级分类自身或任一子分类存在文件，则该顶级分类计为已有文件。进度 = 已有文件的顶级分类数 / 顶级分类总数。</p><p>未包含“必交资料清单全部提交并验收”的判定。</p>`,`<button class="primary" onclick="closeModal();openProject(1)">查看关联资料示例</button>`)}

projects.forEach((p,i)=>{p.dept=i<3?'项目管理部':i===3?'综合管理部':'造价咨询部';p.type=workTypes[i%7]});
contracts.forEach((c,i)=>{c.dept='综合管理部';c.category=i===1?'代建':'监理';c.type=i===1?'合作':'自接';c.nature=i===2?'框架':'普通';c.initial=[480000,720000,250000][i];c.adjust=[20000,-10000,0][i];c.final=c.initial+c.adjust;c.state=i<2?'已通过':'待审批';c.name=['虚构 · 社区服务中心监理','虚构 · 城北配套代建','虚构 · 年度咨询合同'][i]});
function sceneHint(){$('accountscene').classList.toggle('active',S.scene==='account');$('demoscene').classList.toggle('active',S.scene==='demo');$('profileSelect').value=S.profile;$('profileName').textContent=ownDept()+' · '+(S.profile==='general'?'只读':'部门编辑');$('scenedesc').textContent=S.scene==='account'?'基础流程 · 业务信息为虚构示例':'新增协作方案 · 仅本地演示';}

function home(){sceneHint();$('page').innerHTML=`<div class="homeactual"><div class="heading"><div><h1>工作台</h1><p>保留现有四个流程入口与通知公告</p></div><span class="right tag green">基础流程示例</span></div>${S.profile!=='general'?`<div class="box row" style="border-left:4px solid var(--orange)"><div><h2>我提交的合同</h2><p style="margin-top:8px">示例 2 条${S.profile==='project'?' · 1 条被驳回需修改':''}</p></div><button class="right" onclick="nav('todo')">查看进度 →</button></div>`:''}<div class="twocol"><section><div class="quick">${[['☷','流程发起'],['▤','我的流程'],['☏','待办事宜'],['▣','已办任务']].map(([i,n])=>`<button onclick="flowEntry('${n}')"><b>${i}</b>${n}</button>`).join('')}</div></section><aside class="box"><h2>♧ 通知公告</h2><div class="empty" style="border:none;padding:35px 0">暂无展示内容</div></aside></div><div class="box"><h2>常用业务</h2><div class="chips"><button onclick="changeDept(ownDept())">本部门资料</button><button onclick="contractNav(ownDept())">本部门合同</button><button onclick="nav('todo')">合同申请审批</button></div></div><div class="box bluebox"><div class="row"><h2>资料协作扩展</h2><span class="right tag blue">新增方案</span></div><p style="margin:12px 0">进入虚构演示项目，评审任务、排期、归档审批、依赖关系与知识助手。</p><button onclick="setScene('demo');nav('material')">体验完整功能 →</button></div></div>`}
function flowEntry(n){modal(n,`<div class="note" style="margin-top:18px">工作台提供“${n}”入口。合同流程进入现有合同申请审批，资料协作作为新增业务接入。</div>`,`<button onclick="closeModal();nav('todo')">查看合同申请审批</button><button class="primary" onclick="closeModal();setScene('demo');openProject(projects.find(p=>p.dept===ownDept()).id);S.tab='tasks';drawProject()">体验资料任务方案</button>`)}

$('page').innerHTML=`<div class="heading"><div><h1>合同管理 · ${S.contractScope}</h1><p>保留现有查询、勾选汇总、导出与附件入口</p></div><span class="right tag">${S.profile==='general'?'本部门 · 仅查看':'本部门 · 合同维护'}</span></div><div class="note">合同名称、金额和导出内容均使用虚构数据。</div><div class="box"><div class="contractfilters"><label><span>项目编码</span><input id="c-code" aria-label="项目编码筛选" value="${esc(S.cf.code||'')}" placeholder="模糊匹配"></label><label><span>项目名称</span><input id="c-name" aria-label="项目名称筛选" value="${esc(S.cf.name||'')}" placeholder="模糊匹配"></label>${[['category','合同类别',['全部','监理','代建']],['type','合同类型',['全部','自接','合作']],['nature','合同性质',['全部','普通','框架']],['owner','项目经理',['全部','项目成员甲','项目成员乙','项目成员丙']]].map(([k,n,opts])=>`<label><span>${n}</span><select id="c-${k}" aria-label="${n}筛选">${opts.map(v=>`<option ${S.cf[k]===v?'selected':''}>${v}</option>`).join('')}</select></label>`).join('')}<label><span>合作信息</span><input id="c-cooperation" aria-label="合作信息筛选" value="${esc(S.cf.cooperation||'')}" placeholder="关键词"></label><label><span>审批状态</span><select id="c-status" aria-label="审批状态筛选">${['全部','待审批','已通过','已拒绝'].map(v=>`<option ${S.cs===v?'selected':''}>${v}</option>`).join('')}</select></label><label><span>合同金额</span><input type="number" min="0" id="c-min" aria-label="最小金额" value="${esc(S.cf.min||'')}" placeholder="最小"><span style="min-width:0">~</span><input type="number" min="0" id="c-max" aria-label="最大金额" value="${esc(S.cf.max||'')}" placeholder="最大"></label></div><div class="row" style="margin-top:14px"><button class="primary" onclick="applyContractFilters()">搜索</button><button onclick="S.cf={};S.cs='全部';S.cq='';contract()">重置</button></div></div><div id="contractresults"></div><div class="note">保留“全选当前页 / 全选全部结果 / 清空选择”。汇总只计算选中项；合同查看权与资料上传权分别判定。正式版原有多选筛选能力应保留，原型简化为单选。</div>`;contractTable()}
function applyContractFilters(){for(const k of ['code','name','category','type','nature','owner','cooperation','min','max'])S.cf[k]=$('c-'+k).value;S.cs=$('c-status').value;contractTable()}
function contractTable(){const arr=contractRows(),sel=contracts.filter(c=>S.cselected.has(c.id)),sum=k=>money(sel.reduce((a,c)=>a+c[k],0));$('contractresults').innerHTML=`<div class="batch"><span>已选 <b>${sel.length}</b> / 当前结果 ${arr.length} 条</span><button onclick="contractRows().forEach(c=>S.cselected.add(c.id));contractTable()">全选当前页</button><button onclick="contractRows().forEach(c=>S.cselected.add(c.id));contractTable()">全选全部结果</button><button onclick="S.cselected.clear();contractTable()">清空选择</button></div>`+stats([['已选合同数',sel.length,'未选择时为 0'],['最终金额合计','¥'+sum('final'),'初定金额 + 增减项'],['初定金额合计','¥'+sum('initial'),'选中记录'],['增减项合计','¥'+sum('adjust'),'选中记录']])+`<div class="box"><div class="row" style="margin-bottom:12px">${S.profile!=='general'?'<button class="primary" onclick="contractAction(0,\'新增\')">＋ 新增</button>':''}<button onclick="exportContracts()">导出演示台账 CSV</button><button ${sel.length?'':'disabled'} onclick="modal('合同附件打包','<p style=\"margin-top:18px\">已选合同附件按项目编码归集。原型无实际附件；正式版复用现有打包下载。</p>')">打包附件</button><span class="muted right" style="font-size:12px">正式版保留 Excel 导出</span></div><div class="tablewrap"><table><thead><tr>${['选择','项目编码','创建人','项目名称（地址）','最终合同金额','初定合同金额','增减项','合同类别','合同类型','合同性质','项目大类','部门','项目经理','合作信息','开工时间','竣工时间','工期','项目施工进度','附件','审批状态','操作'].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${arr.map(c=>`<tr><td><input aria-label="选择合同${c.code}" type="checkbox" ${S.cselected.has(c.id)?'checked':''} onchange="this.checked?S.cselected.add(${c.id}):S.cselected.delete(${c.id});contractTable()"></td><td>${c.code}</td><td>演示成员</td><td>${c.name}</td><td>¥${money(c.final)}</td><td>¥${money(c.initial)}</td><td>¥${money(c.adjust)}</td><td>${c.category}</td><td>${c.type}</td><td>${c.nature}</td><td>示例工程</td><td>${c.dept}</td><td>${c.owner}</td><td>—</td><td>2026-09-01</td><td>2026-12-31</td><td>按合同约定</td><td>进行中</td><td>演示无附件</td><td>${tag(c.state)}</td><td>${contractActions(c)}</td></tr>`).join('')}</tbody></table>${arr.length?'':'<div class="empty">无匹配合同，请调整筛选条件</div>'}</div><p class="muted" style="margin-top:12px;font-size:12px">共 ${arr.length} 条 · 第 1 页（演示数据仅一页）</p></div>`}
function todo(){sceneHint();const tabs=['抄送/提及待阅','待我审批','我提交的合同','已阅抄送','审批历史','查看权限申请-待我审批','查看权限申请-我的申请'];$('page').innerHTML=`<div class="heading"><div><h1>合同申请审批</h1><p>合同审批、抄送阅读与查看权限申请分别处理</p></div><span class="tag">原有业务</span></div><div class="box"><div class="chips">${tabs.map(t=>`<button onclick="document.querySelectorAll('#page .chips button').forEach(b=>b.classList.remove('primary'));this.classList.add('primary');$('approvalempty').textContent='${t}：本地原型未载入真实业务记录'">${t}</button>`).join('')}</div><div class="tablewrap" style="margin-top:20px"><table><thead><tr>${['项目编码','项目名称','所属部门','合同金额','项目经理','提交时间','操作'].map(v=>`<th>${v}</th>`).join('')}</tr></thead></table></div><div class="empty" id="approvalempty">待我审批：本地原型未载入真实业务记录</div></div><p class="footerhint">七个页签分别承接审批、抄送和查看权限申请，各自展示对应记录。</p>`}

function design(){sceneHint();$('page').innerHTML=`<div class="heading"><div><div class="pillhead">交互原型 / V4</div><h1>沿用现有工作台，按部门与业务权限设计</h1><p>三种账号视角；基础流程保持一致，新增协作逐步接入</p></div></div><div class="box tablewrap"><table><thead><tr><th>部门视角</th><th>资料页</th><th>合同页</th></tr></thead><tbody><tr><td>综合管理部</td><td>本部门只读，列表为空</td><td>两条可见，行内仅查看</td></tr><tr><td>项目管理部</td><td>部门编辑，一个项目；详情分类 0、文件 0</td><td>新增、修改、删除、历史；被拒绝记录可提交审批</td></tr><tr><td>造价咨询部</td><td>部门编辑，列表为空</td><td>新增、修改、删除、历史</td></tr></tbody></table></div><div class="design-grid"><div class="box"><h2>现有基础优化</h2><ul class="steps"><li>默认进入所属部门，切换清空旧部门状态。</li><li>编辑空态显示新建，只读空态说明权限。</li><li>未配置分类明确提示；覆盖率不等于齐套。</li><li>合同完整字段与状态操作、七个审批页签保留。</li></ul></div><div class="box"><h2>需要新增开发</h2><ul class="steps"><li>项目专用分类、必交清单、版本及归档业务。</li><li>任务、子任务、依赖、排期与通知。</li><li>带权限过滤和来源定位的知识助手。</li><li>收付款计划与实际流水核销。</li></ul></div></div><div class="note">基础流程展示部门权限、资料和合同页面；扩展流程展示任务协作、依赖和归档方案。所有数据均为虚构示例。</div>`}



function ownDept(){return {project:'项目管理部',cost:'造价咨询部',general:'综合管理部'}[S.profile]}
function setProfile(v){S.profile=v;S.contractScope=ownDept();S.cf={};S.cs='全部';S.cq='';contracts.forEach((c,i)=>{c.dept=ownDept();c.state=v==='project'&&i===1?'已拒绝':'已通过'});setScene(S.scene);nav('material')}
function accountResults(){const project=S.profile==='project',matched=(!S.q||('DEMO-P001 示例 · 项目资料整理').toLowerCase().includes(S.q.toLowerCase()))&&(S.type==='全部'||S.type==='街道');$('accountresults').innerHTML=project&&matched?`<div class="row" style="margin-bottom:14px"><small>共 1 个项目 · 名称与编码为虚构示例</small></div><div class="grid"><article class="proj"><div class="row"><span class="code">DEMO-P001</span><span class="right tag orange">进行中</span></div><button class="plain" style="color:var(--ink);text-align:left" onclick="snapshotProject()"><h2>示例 · 项目资料整理</h2></button><p>街道 · 部门成员</p><div class="note" style="margin:18px 0">分类未配置 · 暂无文件</div><button onclick="snapshotProject()">进入资料项目 →</button></article></div>`:`<div class="accountempty"><div class="emptyicon">▱</div><h2>${project?'没有匹配的项目':S.profile==='general'?'当前部门暂无可查看的资料项目':'从第一个资料项目开始'}</h2><p class="muted" style="margin:12px">${project?'调整项目编码、名称或工作类型后重试。':S.profile==='general'?'你拥有本部门只读权限，请由有权限的成员创建项目。':'当前部门尚无资料项目。选择工作类型、填写项目名称即可创建。'}</p>${!project&&S.profile!=='general'?'<button class="primary" onclick="snapshotNew()">＋ 新建项目</button>':''}</div>`}
function snapshotNew(){if(!canWrite())return;newProject();$('dialog').querySelector('.dialogfooter .primary').outerHTML='<button class="primary" onclick="notice(\'这是表单展示；切换扩展流程可创建本地示例\')">创建（表单展示）</button>'}
function snapshotProject(){if(S.profile!=='project'||S.dept!==ownDept())return;$('drawer').classList.add('open');$('drawerhead').innerHTML=`<div class="row"><span class="tag orange">DEMO-P001</span><button class="close right" aria-label="关闭项目详情" onclick="closeDrawer()">×</button></div><h1>示例 · 项目资料整理</h1><p>街道 · 部门成员 · 项目管理部</p>`;$('drawerbody').innerHTML=`<div class="box row"><span>分类覆盖</span><b>未配置</b><span class="right">0 个文件</span></div><div class="row"><h2>分类清单</h2><button class="right" onclick="snapshotCategory()">＋ 添加分类项</button></div><div class="accountempty"><div class="emptyicon">▱</div><h2>尚未配置资料分类</h2><p style="margin:14px">先确认工作类型对应的分类模板，再归集文件。</p><button onclick="snapshotCategory()">查看分类配置</button></div><div class="note">现有分类按共享工作类型模板维护。新增前需明确影响范围；“项目专用分类”属于新增方案。</div><button class="plain" style="color:#ad5555;margin-top:15px" onclick="notice('这里只展示现有删除入口，不操作真实项目')">删除项目</button><div class="box bluebox" style="margin-top:20px"><h2>下一步：评审资料协作扩展</h2><p style="margin:12px 0">使用有分类和文件的虚构项目，查看任务、依赖和归档方案。</p><button onclick="setScene('demo');openProject(projects.find(p=>p.dept===ownDept()).id)">打开完整功能演示 →</button></div>`}
function snapshotCategory(){modal('添加分类项',`<div class="note" style="margin-top:15px">作用范围：共享工作类型模板。此处用于展示分类配置表单。</div><label>分类名 *</label><input placeholder="例如：现场协调会纪要"><label>说明</label><textarea placeholder="可选"></textarea><label>排序号</label><input type="number" value="99">`,`<button onclick="closeModal()">取消</button><button class="primary" onclick="notice('本地表单展示，未修改共享模板')">添加（表单展示）</button>`)}
function contractActions(c){if(S.profile==='general')return '<span class="tag">仅查看</span>';return `<div style="display:flex;gap:8px;white-space:nowrap"><button class="plain" onclick="contractAction(${c.id},'修改')">修改</button>${c.state==='已拒绝'?`<button class="plain" onclick="contractAction(${c.id},'提交审批')">提交审批</button>`:''}<button class="plain" onclick="contractAction(${c.id},'删除')">删除</button><button class="plain" onclick="contractAction(${c.id},'历史')">历史</button></div>`}
function contractAction(id,action){modal('合同'+action,`<div class="note" style="margin-top:20px">此入口用于体验合同处理流程。此处用于评审状态和权限，不提交真实合同或审批。</div><p style="margin:15px 0">${action==='提交审批'?'已拒绝合同可修改后重新提交；正式页面沿用原审批链。':action==='历史'?'正式版展示现有合同审批与操作历史，本原型没有真实历史记录。':'正式实施复用现有合同表单和权限校验。'}</p>`,`<button onclick="closeModal()">关闭</button>${id?`<button onclick="closeModal();contractDetail(${id})">查看虚构详情</button>`:''}`)}

contracts.forEach((c,i)=>{c.dept=ownDept();c.state=i===1?'已拒绝':'已通过'});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('modal').classList.contains('open'))closeModal();else closeDrawer()}});nav('material');
</script></body></html>
