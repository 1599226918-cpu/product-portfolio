<body>

<header class="top" id="projects">
  <div class="brand"><span class="brand-icon" aria-hidden="true">↗</span><div><a class="home" href="../">个人作品集</a><h2 style="margin:0;font-size:20px">产品页面流程图</h2></div></div>
  <div class="top-actions" aria-label="浏览方式"><button id="flowMode" type="button" aria-pressed="true">流程画布</button><button id="libraryMode" type="button" aria-pressed="false">全部截图</button></div>
</header>
<nav id="products" class="products" aria-label="产品"></nav>
<main>
  <section id="flowView" class="workspace">
    <aside class="sidebar">
      <div class="side-heading"><h2 id="productName"></h2><p id="productDesc"></p></div>
      <nav id="routes" class="routes" aria-label="项目流程"></nav>
      <div class="legend"><span><i class="click"></i> 点击打开</span><span><i class="state"></i> 提交或状态变化</span><span><i class="role"></i> 另一角色接手</span></div>
    </aside>
    <div class="mainpane">
      <div class="toolbar"><div><h2 id="flowName"></h2><p id="flowDesc"></p></div><div class="zoom" aria-label="画布缩放"><button id="zoomOut" type="button" aria-label="缩小">−</button><output id="zoomValue" aria-live="polite"></output><button id="zoomIn" type="button" aria-label="放大">＋</button><button id="zoomFit" type="button">适应画布</button></div></div>
      <div class="canvas" id="canvas" tabindex="0" aria-label="产品流程图画布"><div id="sizer"><div id="stage" class="stage"></div></div></div>
      <p class="hint">拖动画布空白处平移 · 点击连线标签查看下一页 · 点击截图看大图</p>
    </div>
  </section>
  <section id="library" class="library" hidden>
    <div class="librarybar"><div><h2 id="libraryTitle">截图资料库</h2><p id="count"></p></div><input id="search" type="search" placeholder="搜索页面、角色或截图编号" aria-label="搜索截图"></div>
    <div id="grid"></div>
  </section>
</main>
<dialog id="viewer" aria-labelledby="viewerTitle">
  <div class="viewerbar"><div><p id="viewerCaption"></p><h2 id="viewerTitle"></h2></div><div class="viewer-actions"><a id="original" target="_blank" rel="noopener">单独打开图片 ↗</a><button id="close" type="button" aria-label="关闭截图">×</button></div></div>
  <div class="viewerbody"><img id="large" alt=""></div><div id="viewerNext" class="viewer-next"></div>
</dialog>

</script><script>
(() => {
  'use strict';
  const data=window.FLOW_DATA;
  const $=id=>document.getElementById(id);
  const byId=new Map(data.items.map(x=>[x.id,x]));
  const typeLabels={click:'点击打开',state:'提交或状态变化',role:'另一角色接手'};
  const canvas=$('canvas'),stage=$('stage'),dialog=$('viewer');
  let product=data.products[0].id, flow=data.flows[0], zoom=1, mode='flow', restore=null;
  const clamp=(value,low,high)=>Math.max(low,Math.min(high,value));
  function el(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e}
  function button(text,fn){const e=el('button',text);e.type='button';e.addEventListener('click',fn);return e}
  const file=(id,thumb=false)=>'../images/'+(thumb?'thumbs/':'')+id+'.webp';
  function image(item,thumb=true){const img=el('img');img.src=file(item.id,thumb);img.alt=item.title+' · 脱敏截图';img.loading='lazy';img.decoding='async';return img}
  function productName(p){return data.products.find(x=>x.id===p).name}
  function open(id,at=null,trigger=null,via=''){
    const item=byId.get(id);if(!item)return;
    if(!dialog.open){restore=trigger||document.activeElement;dialog.showModal()}
    $('viewerTitle').textContent=item.title;
    $('viewerCaption').textContent=productName(item.p)+' · #'+id+(via?' · '+via:' · '+item.source);
    $('large').src=file(id);$('large').alt=item.title+' · 脱敏截图';
    $('original').href=file(id);
    const n=$('viewerNext');n.replaceChildren();
    if(Number.isInteger(at)){
      if(at>0)n.append(button('← 上一页',()=>open(flow.nodes[at-1],at-1)));
      if(at<flow.edges.length)n.append(button(flow.edges[at].label+' →',()=>open(flow.nodes[at+1],at+1,null,typeLabels[flow.edges[at].type])));
    }else{
      for(const linked of data.flows.filter(f=>f.nodes.includes(id)).slice(0,4)){
        n.append(button('看流程 · '+linked.title,()=>{dialog.close();product=linked.p;flow=linked;setMode('flow');render()}));
      }
    }
  }
  $('close').addEventListener('click',()=>dialog.close());
  dialog.addEventListener('close',()=>{if(restore?.isConnected)restore.focus({preventScroll:true})});
  dialog.addEventListener('click',e=>{if(e.target===dialog){const b=dialog.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)dialog.close()}});
  function resize(){
    stage.style.transform='scale('+zoom+')';
    $('sizer').style.width=Math.ceil(stage.offsetWidth*zoom)+'px';
    $('sizer').style.height=Math.ceil(stage.offsetHeight*zoom)+'px';
    $('zoomValue').textContent=Math.round(zoom*100)+'%';
  }
  function changeZoom(next,x=canvas.clientWidth/2,y=canvas.clientHeight/2){
    const old=zoom;
    zoom=clamp(next,.28,2);
    const left=(canvas.scrollLeft+x)/old,top=(canvas.scrollTop+y)/old;
    resize();canvas.scrollLeft=left*zoom-x;canvas.scrollTop=top*zoom-y;
  }
  function fit(){
    zoom=clamp(Math.min(canvas.clientWidth/stage.offsetWidth,canvas.clientHeight/stage.offsetHeight),.28,1);
    resize();canvas.scrollLeft=0;canvas.scrollTop=0;
  }
  $('zoomIn').addEventListener('click',()=>changeZoom(zoom*1.2));
  $('zoomOut').addEventListener('click',()=>changeZoom(zoom/1.2));
  $('zoomFit').addEventListener('click',fit);
  canvas.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();const r=canvas.getBoundingClientRect();changeZoom(zoom*Math.exp(-e.deltaY*.003),e.clientX-r.left,e.clientY-r.top)}},{passive:false});
  let drag=null;
  canvas.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='mouse'||e.button!==0||e.target.closest('button,a'))return;
    drag={id:e.pointerId,x:e.clientX,y:e.clientY,left:canvas.scrollLeft,top:canvas.scrollTop};
    canvas.setPointerCapture(e.pointerId);canvas.classList.add('drag');
  });
  canvas.addEventListener('pointermove',e=>{if(drag){canvas.scrollLeft=drag.left+drag.x-e.clientX;canvas.scrollTop=drag.top+drag.y-e.clientY}});
  ['pointerup','pointercancel','lostpointercapture'].forEach(type=>canvas.addEventListener(type,()=>{drag=null;canvas.classList.remove('drag')}));
  function renderFlow(){
    const p=data.products.find(x=>x.id===product);
    $('productName').textContent=p.name;$('productDesc').textContent=p.desc;
    $('flowName').textContent=flow.title;$('flowDesc').textContent=flow.desc;
    $('routes').replaceChildren(...data.flows.filter(x=>x.p===product).map(f=>{
      const b=button(f.title,()=>{flow=f;renderFlow()});b.setAttribute('aria-pressed',String(f===flow));return b
    }));
    stage.replaceChildren();
    flow.nodes.forEach((id,i)=>{
      const item=byId.get(id);
      const card=el('article','','node');
      const shot=button('',()=>open(id,i,shot));shot.className='imagebutton';shot.setAttribute('aria-label','查看截图 · '+item.title);
      const frame=el('figure');frame.append(image(item));shot.append(frame);
      const title=el('div','','nodetitle');title.append(el('b',item.title),el('small','第 '+(i+1)+' 步 · #'+id));card.append(shot,title);stage.append(card);
      if(i<flow.edges.length){
        const e=flow.edges[i],wrap=el('div','','edge '+e.type);
        const b=button(e.label,()=>open(flow.nodes[i+1],i+1,b,typeLabels[e.type]+' · '+e.label));
        b.title=typeLabels[e.type]+' · '+byId.get(flow.nodes[i+1]).title;wrap.append(b);stage.append(wrap);
      }
    });
    zoom=innerWidth<700?.78:1;resize();canvas.scrollLeft=0;canvas.scrollTop=0;
  }
  function renderLibrary(){
    const q=$('search').value.trim().toLowerCase();
    const rows=data.items.filter(x=>(product==='all'||x.p===product)&&(!q||[x.id,x.title,x.source,productName(x.p)].some(v=>v.toLowerCase().includes(q))));
    $('count').textContent=rows.length+' 张截图 · 点击缩略图打开';
    $('grid').replaceChildren(...rows.map(item=>{
      const tile=button('',()=>open(item.id,null,tile));tile.className='tile';tile.setAttribute('aria-label','查看截图 · '+item.title);
      const caption=el('span');caption.append(el('b',item.title),el('small','#'+item.id+' · '+productName(item.p)+' · '+item.source));
      tile.append(image(item),caption);return tile
    }));
    if(!rows.length)$('grid').append(el('p','没有匹配的页面。','empty'));
  }
  function render(){
    const options=mode==='library'?[{id:'all',name:'全部项目'},...data.products]:data.products;
    $('products').replaceChildren(...options.map(p=>{
      const b=button(p.name,()=>{product=p.id;flow=data.flows.find(f=>f.p===product)||data.flows[0];render()});
      b.setAttribute('aria-pressed',String(product===p.id));return b
    }));
    if(mode==='flow')renderFlow();else renderLibrary();
  }
  function setMode(next){
    mode=next;
    if(next==='flow'&&product==='all'){product=data.products[0].id;flow=data.flows[0]}
    $('flowView').hidden=next!=='flow';$('library').hidden=next!=='library';
    $('flowMode').setAttribute('aria-pressed',String(next==='flow'));$('libraryMode').setAttribute('aria-pressed',String(next==='library'));
  }
  $('flowMode').addEventListener('click',()=>{setMode('flow');render()});
  $('libraryMode').addEventListener('click',()=>{setMode('library');product='all';render()});
  $('search').addEventListener('input',renderLibrary);
  function selectFromHash(){
    const initial=location.hash.slice(1);
    const initialFlow=data.flows.find(f=>f.id===(initial==='rag'?'f10':initial));
    if(initialFlow){product=initialFlow.p;flow=initialFlow;}
    else if(data.products.some(p=>p.id===initial)){product=initial;flow=data.flows.find(f=>f.p===initial)}
    setMode('flow');render();
    if(initialFlow||data.products.some(p=>p.id===initial)) $('projects').scrollIntoView();
  }
  window.addEventListener('hashchange',selectFromHash);
  selectFromHash();
})();

</script>
</body></html>
