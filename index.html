<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c2239">
  <meta name="description" content="孟紫秋的产品经理作品集，展示企业数字化和 AI 应用项目。">
  <title>我的作品集｜孟紫秋</title>
  <style>
    :root{color-scheme:dark;--navy:#1c2239;--pink:#ff9bb8;--cream:#faf9ef;--panel:#272e49;font:16px/1.5 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;background:var(--navy);color:var(--cream)}
    a,button{font:inherit;color:inherit}
    a{text-decoration:none}
    button{cursor:pointer}
    :focus-visible{outline:3px solid var(--pink);outline-offset:5px}
    .cover{position:relative;isolation:isolate;min-height:100vh;min-height:100svh;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto}
    .cover-label{position:relative;z-index:2;padding:clamp(19px,3vw,40px) clamp(19px,4vw,60px);font-size:12px;letter-spacing:.14em;color:#d9dced}
    .cover-title{position:absolute;z-index:-1;top:clamp(52px,10vh,108px);left:50%;transform:translateX(-50%);margin:0;color:var(--pink);font-size:clamp(62px,13vw,205px);letter-spacing:-.06em;font-weight:850;line-height:1.06;white-space:nowrap}
    .cover-art{position:absolute;z-index:0;top:clamp(27px,5vh,64px);left:50%;width:min(108vw,154svh,1600px);transform:translateX(-50%);aspect-ratio:1050 / 1021}
    .cover-art img{display:block;width:100%;height:100%;object-fit:contain}
    .laptop-link{position:absolute;left:27%;top:13.4%;width:18%;height:12%;border:0;background:transparent;border-radius:14px}
    .laptop-link:hover{background:#ffffff13;outline:1px solid #ffffff50}
    .cover-nav{align-self:center;justify-self:end;z-index:2;margin-right:clamp(25px,4vw,68px)}
    .cover-button,.close{display:inline-flex;align-items:center;justify-content:center;gap:12px;border:0;background:var(--cream);color:var(--navy);border-radius:100px;font-weight:750}
    .cover-button{padding:clamp(10px,1.4vw,19px) clamp(17px,2.1vw,32px);font-size:clamp(16px,1.8vw,24px);box-shadow:0 6px 24px #0b102759}
    .cover-button:hover,.close:hover{background:var(--pink)}
    .cover-credit{position:relative;z-index:1;padding:18px clamp(19px,4vw,60px);font-size:12px;color:#d9dced}
    .cover-credit span{display:inline-block;background:#262e49;border-radius:30px;padding:5px 10px}
    dialog{width:min(900px,calc(100% - 32px));max-height:calc(100svh - 32px);overflow:auto;overscroll-behavior:contain;border:1px solid #ffffff26;border-radius:24px;padding:clamp(20px,4vw,44px);background:var(--panel);color:var(--cream)}
    dialog::backdrop{background:#10162bcc;backdrop-filter:blur(8px)}
    .dialog-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}
    .dialog-head h2{margin:0;font-size:clamp(27px,4vw,46px);color:var(--pink);line-height:1.2}
    .close{padding:7px 14px;white-space:nowrap}
    .projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .project{display:grid;gap:4px;padding:14px;border:1px solid #ffffff29;border-radius:12px;background:var(--navy)}
    .project:hover{border-color:var(--pink)}
    .project span{font-size:12px;color:var(--pink)}
    .project strong{font-size:19px}
    .project small{font-size:13px;color:#d9dced}
    @media(max-width:760px){
      .cover-title{top:15vh;font-size:15.6vw}
      .cover-art{top:clamp(70px,17vh,156px);width:min(158vw,115svh)}
      .cover-nav{align-self:end;justify-self:center;margin:0 0 14px}
      .cover-credit{text-align:center;padding:0 12px max(14px,env(safe-area-inset-bottom))}
      .cover-label{padding:18px 19px}
    }
    @media(max-width:440px){.projects{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="cover" aria-labelledby="cover-title">
    <div class="cover-label">孟紫秋 · 产品经理</div>
    <h1 class="cover-title" id="cover-title">我的作品集</h1>
    <div class="cover-art">
      <img src="./images/portrait.webp" width="1050" height="1021" alt="孟紫秋的大头照剪纸拼贴" fetchpriority="high">
      <a class="laptop-link" data-open-projects href="./product-flows/" aria-label="点击笔记本电脑查看作品"></a>
    </div>
    <nav class="cover-nav" aria-label="作品集">
      <a class="cover-button" data-open-projects href="./product-flows/">查看作品 <span aria-hidden="true">↗</span></a>
    </nav>
    <div class="cover-credit"><span>AI 应用与企业数字化</span></div>
  </main>
  <dialog id="projects" aria-labelledby="projects-title">
    <div class="dialog-head"><h2 id="projects-title">产品项目</h2><form method="dialog"><button class="close">关闭 ×</button></form></div>
    <div class="projects">
      <a class="project" href="./product-flows/#oa"><span>01</span><strong>项目信息系统 ↗</strong><small>合同审批、资料权限与智能客服</small></a>
      <a class="project" href="./product-flows/#ride"><span>02</span><strong>企业约车 ↗</strong><small>预约、调度和行车单</small></a>
      <a class="project" href="./product-flows/#buy"><span>03</span><strong>内部采购 ↗</strong><small>选品、审批、收货和成本</small></a>
      <a class="project" href="./product-flows/#meal"><span>04</span><strong>宴请与点餐 ↗</strong><small>菜单、定价和厨房出餐</small></a>
    </div>
  </dialog>
  <script>
    const projects = document.getElementById('projects');
    if (typeof projects.showModal === 'function') {
      for (const link of document.querySelectorAll('[data-open-projects]')) {
        link.addEventListener('click', event => {
          if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
          event.preventDefault();
          projects.showModal();
        });
      }
    }
    if (/^#(?:oa|rag|ride|buy|meal|f\d{2})$/.test(location.hash)) {
      location.replace('./product-flows/'+location.hash);
    }
  </script>
</body>
</html>
