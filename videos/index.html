<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202640">
  <meta name="description" content="我的视频剪辑作品：用画面、声音和节奏讲好故事。">
  <title>视频作品｜我的作品集</title>
  <link rel="icon" href="/product-portfolio/portraits/expressions/smile-v1.webp" type="image/webp">
  <link rel="stylesheet" href="/product-portfolio/work-library.css">
</head>
<body data-library="videos">
  <nav class="library-nav" aria-label="作品导航">
    <a class="home-link" href="/product-portfolio/"><span aria-hidden="true">↖</span> 返回首页</a>
    <div class="nav-links"><a href="/product-portfolio/shows/">项目案例</a><a href="/product-portfolio/skills/">Skill 合集</a></div>
  </nav>
  <main>
    <header class="library-heading">
      <p class="eyebrow">画面 · 叙事 · 节奏</p>
      <h1>视频作品<span class="heading-symbol" aria-hidden="true">↗</span></h1>
      <p class="intro">把想法剪成看得见的故事。</p>
    </header>
    <section aria-label="视频作品列表">
      <p>公开视频素材待整理。可先查看<a href="/product-portfolio/watch-listen/">项目演示与复盘</a>。</p>
      <div class="section-label"><span>视频作品</span></div>
      <div class="video-grid" data-items>
        <div class="empty-state"><span class="empty-icon" aria-hidden="true">▷</span><h2>视频作品整理中</h2><p>整理好作品后，会在这里呈现。</p></div>
      </div>
      <noscript><p class="library-note">请启用 JavaScript，以浏览和播放视频作品。</p></noscript>

  </main>
  <footer class="library-footer"><span>让作品自己说话。</span><a href="/product-portfolio/skills/">看看我的 Skill 合集 <span aria-hidden="true">↗</span></a></footer>
  <dialog class="work-dialog video-dialog" data-video-dialog aria-labelledby="video-dialog-title">
    <div class="dialog-top"><h2 id="video-dialog-title"></h2><button class="close-button" type="button" data-close aria-label="关闭视频"><span aria-hidden="true">×</span></button></div>
    <video class="video-player" data-player controls playsinline preload="metadata" aria-label="视频作品播放器"></video>
    <div class="dialog-info"><p data-video-caption></p><button class="text-button" type="button" data-pause>暂停播放</button></div>
  </dialog>

</html>
