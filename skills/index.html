<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202640">
  <meta name="description" content="我的可复用工作流与 Skill 合集：把实践中的方法整理成可以再次使用的工具。">
  <title>Skill 合集｜我的作品集</title>
  <link rel="icon" href="/product-portfolio/portraits/expressions/smile-v1.webp" type="image/webp">
  <link rel="stylesheet" href="/product-portfolio/work-library.css">
  <script defer src="/product-portfolio/work-library.js"></script>
</head>
<body data-library="skills">
  <nav class="library-nav" aria-label="作品导航">
    <a class="home-link" href="/product-portfolio/"><span aria-hidden="true">↖</span> 返回首页</a>
    <div class="nav-links"><a href="/product-portfolio/shows/">项目案例</a><a href="/product-portfolio/videos/">视频作品</a></div>
  </nav>
  <main>
    <header class="library-heading">
      <p class="eyebrow">实践 · 整理 · 复用</p>
      <h1>Skill 合集<span class="heading-symbol book-symbol" aria-hidden="true">✳</span></h1>
      <p class="intro">把做过的事，变成下次更好用的方法。</p>
    </header>
    <section aria-label="可复用工作流列表">
      <div class="section-label"><span>我的工作流</span><span data-count aria-live="polite">正在整理</span></div>
      <div class="skill-grid" data-items>
        <div class="empty-state"><span class="empty-icon" aria-hidden="true">✳</span><h2>工作流正在整理</h2><p>可复用的方法，会逐步收录在这里。</p></div>
      </div>
      <noscript><p class="library-note">请启用 JavaScript，以展开查看工作流内容。</p></noscript>
    </section>
  </main>
  <footer class="library-footer"><span>从一次完成，到反复用好。</span><a href="/product-portfolio/videos/">看看我的视频作品 <span aria-hidden="true">↗</span></a></footer>
  <dialog class="work-dialog skill-dialog" data-skill-dialog aria-labelledby="skill-dialog-title">
    <div class="dialog-top"><p class="eyebrow" data-skill-category></p><button class="close-button" type="button" data-close aria-label="关闭工作流"><span aria-hidden="true">×</span></button></div>
    <div class="skill-body"><h2 id="skill-dialog-title"></h2><p class="skill-summary" data-skill-summary></p><div data-skill-detail></div><p class="source-note" data-skill-source></p></div>
  </dialog>
</body>
</html>
